<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <title>XW Tech · Dokumentzugang</title>
  <link rel="stylesheet" href="assets/i18n.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #081016;
      --panel: #101c25;
      --line: rgba(255,255,255,.11);
      --text: #f3f7fa;
      --muted: #a8b5bf;
      --accent: #ff6b2a;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(255,107,42,.18), transparent 30rem),
        radial-gradient(circle at 85% 85%, rgba(45,196,179,.13), transparent 28rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
    }
    main {
      width: min(680px, 100%);
      padding: clamp(28px, 7vw, 58px);
      background: rgba(16,28,37,.86);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 28px 80px rgba(0,0,0,.36);
      backdrop-filter: blur(18px);
    }
    .mark {
      display: grid;
      width: 48px;
      height: 48px;
      margin-bottom: 26px;
      place-items: center;
      color: #160d08;
      background: var(--accent);
      border-radius: 15px;
      font-weight: 900;
      letter-spacing: -.05em;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.8rem);
      line-height: 1;
      letter-spacing: -.045em;
    }
    p {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.6vw, 1.16rem);
      line-height: 1.7;
    }
    .note {
      margin-top: 30px;
      padding: 15px 17px;
      color: #dce6ec;
      background: rgba(255,255,255,.045);
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: .92rem;
    }
  </style>
</head>
<body data-page="landing">
  <div class="xw-language-switcher" role="group" aria-label="Language">
    <button type="button" data-lang-switch="zh">中文</button>
    <button type="button" data-lang-switch="en">EN</button>
    <button type="button" data-lang-switch="de">DE</button>
  </div>
  <main>
    <div class="mark" aria-hidden="true">XW</div>
    <h1>Dokumentzugang</h1>
    <p>
      Bitte öffnen Sie den direkten Dokumentlink, den Sie von Ihrem Ansprechpartner
      erhalten haben.
    </p>
    <div class="note">
      Please use the direct document link provided by your contact.
    </div>
  </main>
  <script src="assets/i18n.js"></script>
</body>
</html>
