<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <title>PUDU Robotics · ERC 文档</title>
  <link rel="stylesheet" href="../../assets/i18n.css">
  <style>
    :root {
      --bg: #f5f7f9;
      --paper: #fff;
      --ink: #18212a;
      --muted: #687582;
      --line: #dce3e8;
      --orange: #f26a2e;
      --orange-soft: #fff0e8;
      --navy: #102631;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 90% 0, rgba(242,106,46,.13), transparent 26rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.6;
    }
    header {
      padding: 18px max(20px, calc((100vw - 1080px) / 2));
      color: #fff;
      background: var(--navy);
      font-weight: 850;
    }
    main {
      width: min(1080px, calc(100% - 36px));
      margin: 0 auto;
      padding: clamp(48px, 8vw, 84px) 0 80px;
    }
    .brand {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      color: var(--orange);
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .dot {
      width: 12px;
      height: 12px;
      background: var(--orange);
      border-radius: 50%;
    }
    h1 {
      margin: 12px 0 12px;
      font-size: clamp(2.4rem, 7vw, 4.7rem);
      line-height: 1;
      letter-spacing: -.045em;
    }
    .lead { margin: 0; color: var(--muted); font-size: 1.12rem; }
    section { margin-top: 46px; }
    h2 { margin: 0 0 16px; font-size: 1.3rem; }
    .guide {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 22px;
      align-items: center;
      padding: 26px;
      color: inherit;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 14px 40px rgba(26,43,56,.08);
      text-decoration: none;
    }
    .guide:hover { border-color: rgba(242,106,46,.55); }
    .tag {
      display: inline-block;
      margin-bottom: 8px;
      padding: 4px 9px;
      color: #a84217;
      background: var(--orange-soft);
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 850;
    }
    h3 { margin: 0 0 7px; font-size: 1.34rem; }
    .guide p { margin: 0; color: var(--muted); }
    .arrow {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      color: #fff;
      background: var(--orange);
      border-radius: 50%;
      font-size: 1.45rem;
    }
    .empty {
      padding: 22px;
      color: var(--muted);
      background: rgba(255,255,255,.55);
      border: 1px dashed #cbd5dc;
      border-radius: 16px;
    }
    @media (max-width: 620px) {
      .guide { grid-template-columns: 1fr; }
      .arrow { width: 40px; height: 40px; }
    }
  </style>
</head>
<body data-page="pudu">
  <div class="xw-language-switcher" role="group" aria-label="Language">
    <button type="button" data-lang-switch="zh">中文</button>
    <button type="button" data-lang-switch="en">EN</button>
    <button type="button" data-lang-switch="de">DE</button>
  </div>
  <header>PUDU Robotics · ERC Documentation</header>
  <main>
    <div class="brand"><span class="dot"></span>PUDU Robotics</div>
    <h1>普渡机器人文档</h1>
    <p class="lead">操作指南与客户资料分区整理。</p>

    <section>
      <h2>操作指南 · Interactive Guides</h2>
      <a class="guide" href="guides/bellabot-chassis-motor/">
        <div>
          <span class="tag">BellaBot · 图文 + 视频</span>
          <h3>底盘轮毂电机更换与配置说明</h3>
          <p>电机更换视频、motorVersion 字段选择及两个系统配置入口。</p>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <section>
      <h2>客户资料 · Customer Documents</h2>
      <div class="empty">说明书、PDF 与其他交付资料将在这里发布。</div>
    </section>
  </main>
  <script src="../../assets/i18n.js"></script>
</body>
</html>
