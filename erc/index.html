<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <title>ERC 机器人知识库</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/i18n.css">
  <style>
    :root {
      --bg: #f2f5f7;
      --paper: #fff;
      --ink: #17212b;
      --muted: #667583;
      --line: #dbe3e8;
      --navy: #0d2533;
      --teal: #0a8f80;
      --orange: #f26a2e;
      --blue: #3877ed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0, rgba(10,143,128,.12), transparent 26rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.6;
    }
    header {
      padding: 18px max(20px, calc((100vw - 1120px) / 2));
      color: #fff;
      background: var(--navy);
      font-weight: 850;
      letter-spacing: .02em;
    }
    main {
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto;
      padding: clamp(52px, 9vw, 92px) 0 80px;
    }
    .eyebrow {
      color: var(--teal);
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 780px;
      margin: 10px 0 18px;
      font-size: clamp(2.4rem, 7vw, 4.8rem);
      line-height: 1.03;
      letter-spacing: -.045em;
    }
    .lead {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1.04rem, 2.2vw, 1.22rem);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 48px;
    }
    .card {
      min-height: 280px;
      display: flex;
      flex-direction: column;
      padding: 26px;
      color: inherit;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 16px 42px rgba(27,44,58,.08);
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 22px 52px rgba(27,44,58,.14);
    }
    .logo {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--teal);
      border-radius: 16px;
      font-weight: 900;
    }
    .pudu .logo { background: var(--orange); }
    .orion .logo { background: var(--blue); }
    h2 {
      margin: 24px 0 8px;
      font-size: 1.45rem;
      line-height: 1.2;
    }
    .card p { margin: 0; color: var(--muted); }
    .status {
      margin-top: auto;
      padding-top: 24px;
      color: var(--teal);
      font-size: .88rem;
      font-weight: 850;
    }
    .pudu .status { color: var(--orange); }
    .orion .status { color: var(--blue); }
    footer {
      margin-top: 44px;
      color: var(--muted);
      font-size: .84rem;
    }
    @media (max-width: 780px) {
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 220px; }
    }
  </style>
</head>
<body data-page="erc">
  <div class="xw-language-switcher" role="group" aria-label="Language">
    <button type="button" data-lang-switch="zh">中文</button>
    <button type="button" data-lang-switch="en">EN</button>
    <button type="button" data-lang-switch="de">DE</button>
  </div>
  <header>ERC · Robot Knowledge Library</header>
  <main>
    <div class="eyebrow">Customer documentation</div>
    <h1>ERC 机器人知识库</h1>
    <p class="lead">按机器人品牌查看操作指南、维修说明和客户资料。</p>

    <!-- Maintenance: Keep supplier document totals in sync with each supplier index whenever a guide changes. -->
    <section class="grid" aria-label="供应商列表">
      <a class="card pudu" href="pudu/">
        <span class="logo" aria-hidden="true">P</span>
        <h2>PUDU Robotics</h2>
        <p>普渡机器人 · 配送与服务机器人资料</p>
        <span class="status">已有 3 份资料 →</span>
      </a>

      <a class="card" href="cenobots/">
        <span class="logo" aria-hidden="true">C</span>
        <h2>CenoBots</h2>
        <p>商用清洁机器人资料</p>
        <span class="status">资料准备中 →</span>
      </a>

      <a class="card orion" href="orionstar/">
        <span class="logo" aria-hidden="true">O</span>
        <h2>OrionStar</h2>
        <p>猎户星空 · 智能服务机器人资料</p>
        <span class="status">资料准备中 →</span>
      </a>
    </section>

    <footer>仅供获得直接访问链接的客户使用。</footer>
  </main>
  <script src="../assets/i18n.js"></script>
</body>
</html>
