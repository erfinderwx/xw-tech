<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CenoBots · ERC 文档</title>
  <link rel="stylesheet" href="../../assets/i18n.css">
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px;
      color: #17212b; background: #f1f6f5;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    }
    main {
      width: min(720px, 100%); padding: clamp(30px, 7vw, 58px); background: #fff;
      border: 1px solid #d8e4e1; border-radius: 24px; box-shadow: 0 20px 60px rgba(20,52,46,.1);
    }
    .brand { color: #088d7b; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(2rem, 8vw, 4.4rem); line-height: 1; letter-spacing: -.05em; overflow-wrap: anywhere; hyphens: auto; }
    p { margin: 0; color: #667681; font-size: 1.08rem; line-height: 1.7; }
    .empty { margin-top: 30px; padding: 18px; background: #eff8f6; border-radius: 14px; }
  </style>
</head>
<body data-page="cenobots">
  <div class="xw-language-switcher" role="group" aria-label="Language">
    <button type="button" data-lang-switch="zh">中文</button>
    <button type="button" data-lang-switch="en">EN</button>
    <button type="button" data-lang-switch="de">DE</button>
  </div>
  <main>
    <div class="brand">CenoBots · ERC</div>
